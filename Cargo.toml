[package]
name = "rsmtp-sink"
version = "0.1.0"
edition = "2021"
description = "A fast SMTP test sink in Rust, behaviour-compatible with the core of Postfix smtp-sink"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
